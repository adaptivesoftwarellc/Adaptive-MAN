name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Deploy the dashboard to Azure Static Web Apps (Free tier). Only on push to main. Builds against
  # the Prod API with mocks off, then uploads the prebuilt output (skip_app_build). The SPA fallback
  # lives in frontend/public/staticwebapp.config.json, which Vite copies into dist/ so SWA picks it up.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (Prod API, mocks off)
        run: npm run build
        env:
          VITE_OBSERVABILITY_API_URL: https://obs-api-prod.azurewebsites.net
          VITE_USE_MOCKS: "false"
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        # Until the Static Web App + AZURE_STATIC_WEB_APPS_API_TOKEN secret are provisioned, the
        # deploy no-ops instead of failing the job, so this workflow is safe to merge on its own.
        env:
          SKIP_DEPLOY_ON_MISSING_SECRETS: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          # Paths are relative to the repo root, not the step working-directory.
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
